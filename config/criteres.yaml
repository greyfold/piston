# Critères de recherche en version machine : ce que le code sait trancher seul.
# Valeurs par défaut, sans rien de personnel : cantons, requêtes, entreprises, familles
# d'intitulés et règles propres à un métier viennent du profil que la personne remplit
# dans l'application, qui prime sur ce fichier. Tout le reste (adéquation, désirabilité)
# reste « nouvelle » et passe par la personne, aidée de la note d'adéquation de l'IA.
#
# Les motifs sont des expressions régulières Python, appliquées sans accents
# et en minuscules. « limite: true » = écartée, mais montrée dans « Écartées
# limites » sur le tableau de bord pour recalibrer le filtre (constat F-19).
# Aucun montant de salaire dans ce fichier.

sourcing:
  cantons: []
  # Les postes recherchés du profil remplacent les trois listes qui en découlent : ces requêtes
  # (chaque intitulé), les requêtes LinkedIn (une par poste) et familles_cibles (leurs mots).
  requetes: []
  # Une requête par entreprise visée.
  entreprises: []
  # jobup filtre par ville ou par canton (par son nom), pas par rayon ; vide : les cantons, par leur nom.
  jobup_lieux: []
  # LinkedIn par Apify : syntaxe de recherche LinkedIn (« OR »), un run payant par requête.
  linkedin_requetes: []
  linkedin_lieu: ""

# Mots dont l'intitulé doit toucher au moins un (passe 0, « hors de portée ») : vide = aucun
# filtre. Job-Room et jobup cherchent mot par mot ; ce filtre écarte ce qu'ils rapportent hors sujet.
# Déduit des postes du profil (profil.mots_postes) : les mots du métier seulement, jamais les mots de
# fonction (« chef », « responsable », « manager »), qui laisseraient passer une cheffe de cuisine.
familles_cibles: ""

regles:
  # --- Passe 0 : hors de portée, jugée sur le titre et l'employeur -----------------
  - id: titre-allemand
    passe: 0
    champ: titre
    motif: "Langue : intitulé en allemand"
    # « (m/f/d) » se lit aussi dans des intitulés anglais (JTI, 27.10) : l'annonce allemande
    # qui le porte tombe sous « langue-allemand », d'après son texte.
    regex: \((m/w/d|w/m/d)\)|\b(leiter|leiterin|mitarbeiter|mitarbeiterin|sachbearbeiter|verantwortliche|projektleiter|fachspezialist|fuhrungskraft)\b
  - id: employeur-regie
    passe: 0
    champ: entreprise
    motif: "Régie ou société de placement (vérifier si le poste est interne)"
    limite: true
    regex: >-
      \b(ekkiden|adone|amaris|academic work|michael page|page personnel|yellowshark|impirio|
      hays|randstad|adecco|manpower|robert walters|kelly services|interiman|gi group|experis|
      coople|morgan philips|spring professional|kforce)\b

  # --- Passe 1 : éliminatoire, jugée sur le texte ---------------------------------
  - id: niveau-junior
    passe: 1
    champ: titre
    motif: "Niveau : stage, apprentissage ou junior"
    regex: \b(stagiaire|stage|intern|internship|apprenti|apprentie|apprentissage|junior|trainee|praktikum|praktikant|master's thesis|master thesis|thesis|travail de master|graduate assistant|civiliste)\b
  - id: langue-allemand
    passe: 1
    champ: langue
    motif: "Langue : annonce rédigée en allemand"
    regex: ^de$
  - id: allemand-exige
    passe: 1
    champ: titre_texte
    motif: "Langue : allemand exigé"
    # Un niveau d'allemand demandé écarte l'annonce, sous toutes ses formes : un mot d'exigence
    # (« courant », « required »), un niveau du cadre européen (« allemand (B2-C1) » : la forme qui
    # passait au travers le 13.11), des connaissances ou des notions demandées, un intitulé bilingue
    # (« Français / Allemand »). L'intitulé compte autant que le texte : l'annonce est écartée sans
    # même être lue. Chaque ligne du motif finit par « | » : les blocs YAML repliés collent les
    # retours à la ligne, et seules les espaces autour d'un « | » sont retirées à la compilation.
    # L'allemand demandé en atout ne bloque pas (décision du 28.10, ELCA) : les formes qui ne
    # disent pas l'exigence par elles-mêmes vérifient que la suite de la phrase ne l'offre pas.
    regex: >-
      (allemand|german|deutsch|schweizerdeutsch|suisse allemand)[^.\n]{0,60}(?<!pas )(?<!non )\b(courant|indispensable|requis|
      exige|obligatoire|parfait|maternel|fluent|fluency|required|mandatory|native|proficien|business level)|
      (courant|indispensable|parfaite maitrise|maitrise|fluent|fluency|native)[^.\n]{0,30}(en )?(allemand|german)|
      (allemand|german|deutsch)[^.\n]{0,40}\b(a2|b1|b2|c1|c2)\b(?![^.\n]{0,40}(atout|un plus|asset|souhaite|
      bienvenu|apprecie|avantage))|
      \b(a2|b1|b2|c1|c2)\b[^.\n]{0,40}(allemand|german|deutsch)(?![^.\n]{0,40}(atout|un plus|asset|souhaite|
      bienvenu|apprecie|avantage))|
      (connaissances?|kenntnisse|niveau|level|notions)[^.\n]{0,40}(allemand|german|deutsch)(?![^.\n]{0,40}(atout|
      un plus|asset|souhaite|bienvenu|apprecie|avantage))|
      (allemand|german|deutsch)[^.\n]{0,20}(connaissances?|kenntnisse)(?![^.\n]{0,40}(atout|un plus|asset|
      souhaite|bienvenu|apprecie|avantage))|
      (francais|french)\s*[/&+]\s*(allemand|german|deutsch)|
      (allemand|german|deutsch)\s*[/&+]\s*(francais|french)|
      bilingue[^.\n]{0,20}(allemand|german|deutsch)
  - id: contrat-api-duree-determinee
    passe: 1
    champ: permanent
    motif: "Contrat : durée déterminée (selon la plateforme)"
    limite: true
    regex: ^false$
    # Un CDD de deux ans ou plus est accepté (décision du 28.10, OMPI) : la durée doit être
    # dite à côté du contrat, pour ne pas confondre avec « 3 years of experience ».
    # La plateforme ne donne pas la durée : l'exception se lit dans le titre et le texte.
    sauf_champ: titre_texte
    sauf: &cdd_deux_ans >-
      (contrat|contract|cdd|duree|duration|fixed[- ]term|appointment|mission|engagement)[^.\n]{0,40}
      \b([2-9]|deux|trois|quatre|cinq|two|three|four|five)\s*(ans|annees|years?)\b
      |\b([2-9]|deux|trois|quatre|cinq|two|three|four|five)\s*(ans|annees|years?)[^.\n]{0,30}
      (contrat|contract|cdd|fixed[- ]term|renouvelable|renewable|determinee)
      |\b(2[4-9]|[3-9]\d)\s*(mois|months?)\b
  - id: contrat-cdd
    passe: 1
    champ: titre_texte
    motif: "Contrat : CDD ou mission"
    limite: true
    regex: >-
      \b(cdd|duree determinee|contrat determine|temporaire|temporary|fixed[- ]term|befristet|
      remplacement|mission de \d+ mois|contrat de \d+ mois|\d+ mois renouvelable|maternity cover|conge maternite|
      \d+[ -]months?|defined duration|fixed duration|limited duration|duree limitee)\b
    # Un CDD de deux ans ou plus est accepté : même exception que la règle précédente.
    sauf: *cdd_deux_ans
  - id: contrat-freelance
    passe: 1
    champ: titre_texte
    motif: "Contrat : freelance, portage ou temps partiel"
    regex: \b(freelance|free-lance|portage salarial|independant|temps partiel|part[- ]time)\b
  - id: taux
    passe: 1
    champ: taux_max
    motif: "Taux : moins de 100 %"
    regex: ^([0-9]|[1-8][0-9]|9[0-4])$
  - id: canton
    passe: 1
    champ: canton
    motif: "Lieu : hors des cantons choisis"
    # Sans cantons choisis, la règle n'écarte rien ; le profil la règle sur les cantons choisis.
    regex: (?!)

# Balises de raison, un clic dans le tableau de bord (décision du 24.10, D7).
raisons:
  pour:
    - employeur visé
    - poste et mandat conformes
    - angle fort
    - contact dans l'entreprise
    - à saisir vite
  contre:
    - trajet
    - taux ou contrat
    - niveau
    - pas d'IA
    - pas de mandat de cadrage
    - employeur peu attirant
    - exigence que je n'ai pas
    - annonce déjà vue ou douteuse
    - pas le moment
